[package]
name = "cypher-data"
version.workspace = true
edition.workspace = true
description = "Unified cypher CLI for linting and extending .cypher files"
license.workspace = true
repository.workspace = true
publish = true

[[bin]]
name = "cypher"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ariadne = "0.6"
walkdir = "2"
directories = "5"
tree-sitter = "0.26.5"
tree-sitter-cypher = { path = "../.." }
tree-sitter-cypherdoc = { path = "../../tree-sitter-cypherdoc" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[package.metadata.dist]
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
