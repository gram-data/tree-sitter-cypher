name: Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  # ── Tests (must pass before any publishing) ───────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # ── Cypher grammar ──────────────────────────────────────────────────
      - run: npm ci --omit=peer --omit=optional
      - name: Regenerate parser
        run: npx tree-sitter generate
        env:
          TREE_SITTER_ABI_VERSION: 15
      - name: Corpus tests
        run: npx tree-sitter test
      - name: Node binding tests
        run: npm test

      # ── Cypherdoc sub-grammar ───────────────────────────────────────────
      - run: npm ci --omit=peer --omit=optional
        working-directory: tree-sitter-cypherdoc
      - name: Regenerate cypherdoc parser
        run: npx tree-sitter generate
        working-directory: tree-sitter-cypherdoc
        env:
          TREE_SITTER_ABI_VERSION: 15
      - name: Cypherdoc corpus tests
        run: npx tree-sitter test
        working-directory: tree-sitter-cypherdoc

      # ── cypher-data CLI ─────────────────────────────────────────────────
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Build CLI
        run: cargo build -p cypher-data
      - name: Test CLI
        run: cargo test -p cypher-data

  # ── npm ───────────────────────────────────────────────────────────────────
  # Bump package.json versions to match the tag before pushing.
  publish-npm:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - run: npm ci --omit=peer --omit=optional
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: npm ci --omit=peer --omit=optional
        working-directory: tree-sitter-cypherdoc
      - run: npm publish
        working-directory: tree-sitter-cypherdoc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── crates.io ─────────────────────────────────────────────────────────────
  publish-crates:
    name: Publish to crates.io
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-publish-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Publish tree-sitter-cypher
        run: cargo publish -p tree-sitter-cypher
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for index propagation
        run: sleep 30

      - name: Publish tree-sitter-cypherdoc
        run: cargo publish -p tree-sitter-cypherdoc
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for index propagation
        run: sleep 30

      - name: Publish cypher-data
        run: cargo publish -p cypher-data
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ── Cross-platform CLI binaries ───────────────────────────────────────────
  build-binaries:
    name: Build ${{ matrix.artifact-name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use-cross: true
            artifact-name: cypher-linux-x86_64
            binary-ext: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use-cross: true
            artifact-name: cypher-linux-aarch64
            binary-ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            use-cross: false
            artifact-name: cypher-macos-x86_64
            binary-ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            use-cross: false
            artifact-name: cypher-macos-aarch64
            binary-ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use-cross: false
            artifact-name: cypher-windows-x86_64
            binary-ext: ".exe"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use-cross
        run: cargo install cross --locked

      - name: Build (cross)
        if: matrix.use-cross
        run: cross build --release --target ${{ matrix.target }} -p cypher-data

      - name: Build (cargo)
        if: ${{ !matrix.use-cross }}
        run: cargo build --release --target ${{ matrix.target }} -p cypher-data

      - name: Stage binary
        shell: bash
        run: cp target/${{ matrix.target }}/release/cypher${{ matrix.binary-ext }} ${{ matrix.artifact-name }}${{ matrix.binary-ext }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-name }}${{ matrix.binary-ext }}

  # ── GitHub Release ────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: binaries/*
